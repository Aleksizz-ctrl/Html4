<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Task 0-1 - Contact Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --burgundy: #722F37;
            --burgundy-hover: #552229;
        }
        body { background-color: #f8f9fa; }
        .btn-burgundy { background-color: var(--burgundy); color: white; }
        .btn-burgundy:hover { background-color: var(--burgundy-hover); color: white; }
        .navbar-burgundy { background-color: var(--burgundy); }
        .form-control:focus {
            border-color: var(--burgundy);
            box-shadow: 0 0 0 .2rem rgba(114, 47, 55, .25);
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark navbar-burgundy">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">Assignment 4</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="index.html">Task 0-1</a></li>
                    <li class="nav-item"><a class="nav-link" href="task2.html">Task 2</a></li>
                    <li class="nav-item"><a class="nav-link" href="task3.html">Task 3</a></li>
                    <li class="nav-item"><a class="nav-link" href="task4.html">Task 4</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container col-md-6 col-lg-5 py-5">
        <div class="card shadow-sm border-0">
            <div class="card-header text-white text-center py-3" style="background-color: var(--burgundy);">
                <h3 class="mb-0">Contact Form</h3>
            </div>
            <div class="card-body p-4">
                <form>
                    <div class="mb-3">
                        <label for="name" class="form-label fw-bold">Name</label>
                        <input type="text" class="form-control" id="name" placeholder="Enter your full name" minlength="2" maxlength="50" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label fw-bold">Email</label>
                        <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                    </div>
                    <div class="mb-3">
                        <label for="message" class="form-label fw-bold">Message</label>
                        <textarea class="form-control" id="message" rows="4" placeholder="Write your message here..." minlength="10" maxlength="300" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-burgundy w-100 py-2 fw-bold">Submit</button>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
