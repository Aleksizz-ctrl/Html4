<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Contact Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --burgundy: #722F37;
            --burgundy-hover: #552229;
        }
        body {
            background-color: #f8f9fa;
        }
        .btn-burgundy {
            background-color: var(--burgundy);
            color: white;
        }
        .btn-burgundy:hover {
            background-color: var(--burgundy-hover);
            color: white;
        }
    </style>
</head>
<body class="py-5">
    <div class="container col-md-6 col-lg-5">
        <div class="card shadow-sm border-0">
            <div class="card-header text-white text-center py-3" style="background-color: var(--burgundy);">
                <h3 class="mb-0">Contact Form</h3>
            </div>
            <div class="card-body p-4">
                <form>
                    <div class="mb-3">
                        <label for="name" class="form-label fw-bold">Name</label>
                        <input type="text" class="form-control" id="name" placeholder="Enter your full name" maxlength="50" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label fw-bold">Email</label>
                        <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                    </div>
                    <div class="mb-3">
                        <label for="message" class="form-label fw-bold">Message</label>
                        <textarea class="form-control" id="message" rows="4" placeholder="Write your message here..." maxlength="300" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-burgundy w-100 py-2 fw-bold">Submit</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
